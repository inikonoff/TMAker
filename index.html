<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>TMA Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Если вместо сборки отдаются исходники (Pages «Deploy from a branch»), показываем подсказку, а не белый экран.
      setTimeout(function () {
        var root = document.getElementById("root");
        if (root && !root.firstChild) {
          root.innerHTML =
            '<div style="font:15px/1.5 system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 16px;color:#1c2030">' +
            "<h2>TMA Builder не запустился</h2>" +
            "<p>Похоже, GitHub Pages отдаёт исходники, а не собранное приложение.</p>" +
            "<p>В репозитории: <b>Settings → Pages → Source: GitHub Actions</b>, затем перезапустите workflow " +
            "«Проверка и деплой на GitHub Pages» во вкладке Actions.</p></div>";
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
